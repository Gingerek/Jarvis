name: CI

on:
  push:
    branches: [ main, 'phase*/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Restore
        run: dotnet restore Jarvis.slnx -p:Platform=x86
      - name: Build
        run: dotnet build Jarvis.slnx -c Release -p:Platform=x86 --no-restore
      - name: Test
        run: dotnet test Jarvis.slnx -c Release -p:Platform=x86 --no-build
      - name: Doctor
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\doctor.ps1
